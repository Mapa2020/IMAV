services:
  db:
    image: mysql:8.0
    container_name: imav-db
    restart: always
    command: >
      --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-imav_root_secure_2026}
      MYSQL_DATABASE: ${DB_NAME:-bd_imav}
      MYSQL_USER: ${DB_USER:-imav_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-imav_password_2026}
    ports:
      - "${DB_HOST_PORT:-3308}:3306"
    volumes:
      - imav_db_data:/var/lib/mysql
      - ./data_base/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - imav-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mapadoc2025/imav-backend:latest
    container_name: imav-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-imav_root_secure_2026}
      DB_NAME: ${DB_NAME:-bd_imav}
      JWT_SECRET: ${JWT_SECRET:-supersecretkey_imav_motor_2026}
      FRONTEND_URL: "*"
    ports:
      - "5000:5000"
    volumes:
      - ./backend/backups:/app/backups
    networks:
      - imav-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: mapadoc2025/imav-frontend:latest
    container_name: imav-frontend
    restart: always
    depends_on:
      - backend
    environment:
      PORT: 5173
      HOST: 0.0.0.0
    ports:
      - "5173:5173"
    networks:
      - imav-network

volumes:
  imav_db_data:
    name: imav_db_data

networks:
  imav-network:
    name: imav-network
